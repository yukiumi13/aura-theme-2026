# Optional Aura interface preset. Include separately from the color theme.
# Flat top tabs with whitespace separators and regular labels.
tab_bar_edge top
tab_bar_style separator
tab_separator "  "
tab_bar_align left
tab_bar_margin_width 8.0
tab_bar_margin_height 4.0 4.0
tab_title_template " {index}: {title} "
active_tab_font_style normal
inactive_tab_font_style normal

# Fine dividers; foreground colors come from the selected Aura theme.
window_border_width 0.5pt
draw_minimal_borders yes
