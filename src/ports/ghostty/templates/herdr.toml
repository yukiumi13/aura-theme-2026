# Optional Herdr surface overrides for the matching Aura Ghostty family.
# Merge this theme section into Herdr's config; keep your other settings.
# Generated from semantic roles. Text, accents and status colors remain ANSI.
# If [theme] or these subtables already exist, merge keys rather than duplicating.
[theme]
name = "terminal"
auto_switch = true
light_name = "terminal"
dark_name = "terminal"

[theme.custom.light]
active_row_bg = "{{ light.terminalListBackground }}"
selection_bg = "{{ light.terminalListFocusBackground }}"
surface1 = "{{ light.terminalHoverBackground }}"

[theme.custom.dark]
active_row_bg = "{{ dark.terminalListBackground }}"
selection_bg = "{{ dark.terminalListFocusBackground }}"
surface1 = "{{ dark.terminalHoverBackground }}"
