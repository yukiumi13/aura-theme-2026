# {{ name }}
# Generated from shared Aura source colors and roles. Requires Ghostty 1.3+.
# Edit source roles, not this generated file.

background = {{ terminalSurfaceBackground }}
foreground = {{ terminalSurfaceForeground }}
cursor-color = {{ terminalCursor }}
cursor-text = {{ terminalCursorText }}
selection-background = {{ terminalSelectionBackground }}
selection-foreground = {{ terminalSelectionForeground }}

# Separate candidate matches from the active search result (Ghostty 1.3+).
search-background = {{ terminalSearchBackground }}
search-foreground = {{ terminalSearchForeground }}
search-selected-background = {{ terminalSearchSelectedBackground }}
search-selected-foreground = {{ terminalSearchSelectedForeground }}

split-divider-color = {{ terminalSplitDivider }}
unfocused-split-fill = {{ terminalUnfocusedSplitFill }}

# GTK only: set window-theme = ghostty in your own config to use these colors.
window-titlebar-background = {{ terminalTitlebarBackground }}
window-titlebar-foreground = {{ terminalTitlebarForeground }}

palette = 0={{ ansiBlack }}
palette = 1={{ ansiRed }}
palette = 2={{ ansiGreen }}
palette = 3={{ ansiYellow }}
palette = 4={{ ansiBlue }}
palette = 5={{ ansiMagenta }}
palette = 6={{ ansiCyan }}
palette = 7={{ ansiWhite }}
palette = 8={{ ansiBrightBlack }}
palette = 9={{ ansiBrightRed }}
palette = 10={{ ansiBrightGreen }}
palette = 11={{ ansiBrightYellow }}
palette = 12={{ ansiBrightBlue }}
palette = 13={{ ansiBrightMagenta }}
palette = 14={{ ansiBrightCyan }}
palette = 15={{ ansiBrightWhite }}
