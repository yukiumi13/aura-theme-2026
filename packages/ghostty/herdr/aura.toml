# Optional Herdr surface overrides for the matching Aura Ghostty family.
# Merge this theme section into Herdr's config; keep your other settings.
# Generated from semantic roles. Text, accents and status colors remain ANSI.
# If [theme] or these subtables already exist, merge keys rather than duplicating.
[theme]
name = "terminal"
auto_switch = true
light_name = "terminal"
dark_name = "terminal"

[theme.custom.light]
active_row_bg = "#F0EEF7"
selection_bg = "#EBE7F5"
surface1 = "#E5E9EF"

[theme.custom.dark]
active_row_bg = "#1B1532"
selection_bg = "#241B43"
surface1 = "#1B1724"
