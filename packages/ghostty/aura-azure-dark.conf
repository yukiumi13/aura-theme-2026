# Aura Azure Dark
# Generated from shared Aura source colors and roles. Requires Ghostty 1.3+.
# Edit source roles, not this generated file.

background = #1F1F1F
foreground = #D6D6D6
cursor-color = #115EA3
cursor-text = #F0F0F0
selection-background = #082338
selection-foreground = #F0F0F0

# Separate candidate matches from the active search result (Ghostty 1.3+).
search-background = #27313A
search-foreground = #F0F0F0
search-selected-background = #115EA3
search-selected-foreground = #F0F0F0

split-divider-color = #333333
unfocused-split-fill = #1F1F1F

# GTK only: set window-theme = ghostty in your own config to use these colors.
window-titlebar-background = #141414
window-titlebar-foreground = #B3B3B3

