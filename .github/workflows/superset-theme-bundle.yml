name: Build Superset Theme Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/superset-theme-bundle.yml'
      - 'src/ports/superset/**'
      - 'src/ports/shared/**'
      - 'src/core/colors/**'
      - 'packages/superset/**'
      - 'scripts/package-superset-bundle.js'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: write

jobs:
  build-superset-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn build only superset
      - run: yarn package:superset
      - uses: actions/upload-artifact@v4
        with:
          name: aura-theme-2026-superset-themes
          path: |
            dist/superset/*.zip
            packages/superset/aura-theme-2026.json
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/superset/*.zip
